# This configuration expects subgraphs to be running on the
# same machine as the router. For Docker, use graph.yaml instead.
version: 1
subgraphs:
  - name: users
    routing_url: http://localhost:8081/graphql
    schema:
      file: ../users-subgraph/src/main/resources/graphql/schema.graphqls
  - name: products
    routing_url: http://localhost:8082/graphql
    schema:
      file: ../product-subgraph/src/main/resources/graphql/schema.graphqls
  - name: reviews
    routing_url: http://localhost:8083/graphql
    schema:
      file: ../reviews-subgraph/src/main/resources/graphql/schema.graphqls